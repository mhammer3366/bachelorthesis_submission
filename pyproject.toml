[project]
name = "vorarlberg-dialect-tts-thesis"
version = "0.1.0"
description = "Appendix scripts for Vorarlberg dialect TTS bachelor thesis"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "torch>=2.5.1",
    "scikit-learn>=1.3.2",
    "plotly>=6.5.0",
    "kaleido>=1.2.0",
    "networkx>=3.1",
    "holoviews>=1.17.1",
    "selenium>=4.27.1",
    "bokeh>=3.1.1",
    "pandas>=2.0.3",
]

[project.scripts]
evaluate-models = "comparison_prints_of_all_models:main"

